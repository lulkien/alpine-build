# The essential layer: what every profile starts from
#
# A profile is not stacked on top of this file by the resolver; it names what it
# inherits, and this is the layer every profile names:
#
#   inherit = "essential"                  one layer
#   inherit = ["essential", "graphics"]    several, folded left to right
#
# A layer's own `inherit` is resolved first, so the layers apply in one order: the
# deepest parent first, then what inherits it, the profile last. Each layer's
# `apk_add` / `services` puts names into the merged set and its `apk_remove` /
# `services_remove` takes them out again, so the layer that touched a name last
# decides - a profile may remove what its layer added, and a layer below it may
# put it back. A name already in the set keeps its position; a name put back goes
# to the end.
#
# Two rules the resolver enforces:
#   - only the keys below exist; an unknown key fails the build with a line
#     number instead of being silently ignored,
#   - the name must match the file; `essential` is a layer a profile inherits, so
#     it is not offered by `profile list` (only by `profile show`).
#
# This file is also where the image content currently hardcoded in the build
# scripts belongs, so that there is one place describing an image:
#
#   apk_add    scripts/02-bootstrap-rootfs.sh + scripts/03-configure-rootfs.sh
#   services   scripts/03-configure-rootfs.sh
#
# Deliberately NOT here: the packages the build itself needs rather than the
# image — busybox-static and cpio feed the RAM initramfs, e2fsprogs-extra provides
# the resize2fs that grow mode runs from inside it, alpine-base is the rootfs
# floor. Removing those does not produce a smaller image, it produces a broken
# build, so they stay in scripts/02-bootstrap-rootfs.sh.

name = "essential"

# Alpine packages from the v3.22 mirrors that every image carries.
apk_add = [
    "alpine-conf",
    "linux-lts",
    "dropbear",
    "dropbear-openrc",
    "openssh-client-default",
    "openssh-keygen",
    "tzdata",
    "ifupdown-ng",
    "dosfstools",
]

# Nothing removed from the essential set by default. A profile that removes a
# package the build asserts on (resize2fs, say) fails the build, which is the
# point: the assertion names the path that would be missing.
apk_remove = []

# <runlevel>:<service>; a bare name means the default runlevel. growfs and
# mdev-hotplug are board services installed by stage 2, not by a package.
#
# growfs is in the default runlevel because all it does now is arm one grow boot
# and reboot: on a machine whose root filesystem is smaller than its partition it
# saves the boot configuration, points DEFAULT at the `grow` label and reboots,
# and the grow mode (the other mode of the same RAM initramfs) does the resize
# with nothing mounted. The resize itself used to run here, online, and wedged
# this board; see /etc/init.d/growfs for that.
#
# seedrng, not urandom: Alpine 3.22 has no /etc/init.d/urandom, and the previous
# hardcoded list enabled service names with a silent `[ -x ]` guard, so a name
# that did not exist was simply never enabled. The profile list is checked
# against the image instead, which is how this was found.
services = [
    "boot:bootmisc",
    "boot:devfs",
    "boot:dmesg",
    "boot:hwdrivers",
    "boot:mdev",
    "boot:modules",
    "boot:root",
    "boot:sysctl",
    "boot:seedrng",
    "boot:syslog",
    "boot:swclock",
    "boot:hostname",
    "boot:mdev-hotplug",
    "default:networking",
    "default:growfs",
    "default:dropbear",
    "default:crond",
    "default:ntpd",
    "default:local",
]

services_remove = []

# Packages built from recipes/<name>.toml. The essential layer builds none: only a
# profile that runs locally built software names any.
recipes = []

# Alpine packages such a profile's binaries need at runtime beyond what the
# recipes declare themselves. Additive only, like apk_add.
runtime_apk_add = []
